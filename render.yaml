services:
  - type: web
    name: extrator-rreo-cloud
    runtime: docker
    autoDeploy: true
    healthCheckPath: /_stcore/health
    envVars:
      - key: APP_ENV
        value: production
      - key: GOOGLE_STORAGE_BUCKET
        value: maestro-rreo-arquivos
      - key: RREO_SOURCE_BUCKET
        value: appdowelever-arquivos
      - key: RREO_SOURCE_BASE_PREFIX
        value: 01_Arquivo_dos_Estados_RREO_e_FNDE/4_APPDOWELEVER/RREO/
      - key: RREO_SOURCE_ENABLED
        value: "true"
      - key: GOOGLE_SERVICE_ACCOUNT_JSON
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-3.6-flash
      - key: GEMINI_FALLBACK_MODELS
        value: gemini-3.5-flash,gemini-flash-latest
      - key: FNDE_GEMINI_MAX_TENTATIVAS
        value: "3"
      - key: FNDE_USAR_OCR_FALLBACK
        value: "true"
      - key: FNDE_RENDER_SCALE
        value: "2.2"
      - key: TESSERACT_LANG
        value: por+eng
