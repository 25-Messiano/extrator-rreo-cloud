name: Homologacao MAESTRO IA
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt pytest pytest-timeout
      - run: python -m compileall -q .
      - run: pytest -q
      - run: python evals/maestro_ia/run_local.py
      - run: python lab/maestro_ia/mutation_gate.py
